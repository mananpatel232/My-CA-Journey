<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0E2358"/>
      <stop offset="100%" stop-color="#03103D"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" rx="64" fill="url(#g)"/>
  <g filter="url(#shadow)">
    <circle cx="256" cy="256" r="196" fill="#081A4A" stroke="#E5A518" stroke-width="6"/>
  </g>

  <!-- Graduation cap -->
  <g transform="translate(0,-18)">
    <path d="M162 150 L256 112 L350 150 L256 178 Z" fill="#E5A518"/>
    <rect x="250" y="170" width="12" height="36" rx="2" fill="#E5A518" transform="rotate(0 256 188)"/>
    <circle cx="256" cy="214" r="6" fill="#E5A518"/>
  </g>

  <!-- Text: My CA JOURNEY -->
  <text x="50%" y="260" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" fill="#E5A518" font-weight="700">My CA</text>
  <text x="50%" y="305" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="28" fill="#FFFFFF" font-weight="700" letter-spacing="2">JOURNEY</text>

  <!-- Chart / growth icon -->
  <g transform="translate(348,162) scale(0.9)" fill="none" stroke="#E5A518" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 46 L18 22 L36 34 L58 6" />
    <path d="M46 58 v30" stroke-width="6"/>
    <path d="M70 42 v46" stroke-width="6"/>
    <path d="M96 62 v26" stroke-width="6"/>
  </g>

  <!-- Open book icon -->
  <g transform="translate(156,330) scale(1)">
    <path d="M40 20 C80 6 120 6 160 20 L160 64 C120 46 80 46 40 64 Z" fill="#000000" opacity="0.12"/>
    <path d="M40 20 C80 6 120 6 160 20 L160 64 C120 46 80 46 40 64 Z" fill="none" stroke="#E5A518" stroke-width="8" stroke-linejoin="round"/>
  </g>
</svg>
