<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0E2358"/>
      <stop offset="100%" stop-color="#03103D"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" rx="64" fill="url(#bgGradient)"/>
  
  <!-- Outer gold circle border -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#D4A574" stroke-width="8"/>
  
  <!-- Inner circle with glow -->
  <circle cx="256" cy="256" r="200" fill="#081A4A" stroke="#B8956A" stroke-width="3"/>
  
  <!-- Graduation cap -->
  <g transform="translate(256, 140)">
    <!-- Cap top -->
    <ellipse cx="0" cy="0" rx="60" ry="35" fill="#EAC553"/>
    <!-- Cap board/platform -->
    <rect x="-65" y="25" width="130" height="12" fill="#EAC553" rx="2"/>
    <!-- Tassel -->
    <line x1="50" y1="31" x2="80" y2="80" stroke="#EAC553" stroke-width="6" stroke-linecap="round"/>
    <circle cx="80" cy="85" r="6" fill="#EAC553"/>
  </g>
  
  <!-- Text: My CA -->
  <text x="140" y="260" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#EAC553">My CA</text>
  
  <!-- Text: JOURNEY -->
  <text x="145" y="320" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="white" letter-spacing="3">JOURNEY</text>
  
  <!-- Growth/Chart bars on right -->
  <g transform="translate(360, 200)">
    <rect x="0" y="30" width="14" height="30" fill="#EAC553" rx="2"/>
    <rect x="20" y="15" width="14" height="45" fill="#EAC553" rx="2"/>
    <rect x="40" y="0" width="14" height="60" fill="#EAC553" rx="2"/>
  </g>
  
  <!-- Open book icon at bottom -->
  <g transform="translate(140, 360)">
    <!-- Left page -->
    <path d="M 0 0 Q 30 -10 50 0 L 50 50 Q 30 45 0 55 Z" fill="none" stroke="#EAC553" stroke-width="5" stroke-linejoin="round"/>
    <!-- Right page -->
    <path d="M 50 0 Q 80 -10 100 0 L 100 50 Q 80 45 50 55 Z" fill="none" stroke="#EAC553" stroke-width="5" stroke-linejoin="round"/>
  </g>
  
  <!-- Decorative water drop/tear on left -->
  <g transform="translate(100, 260)">
    <ellipse cx="0" cy="0" rx="8" ry="12" fill="#1A1A1A" opacity="0.6"/>
  </g>
</svg>